<text x="560" y="784" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">Candle k: 0 = (+x,+y) 45 deg, 1 = 135 deg, 2 = 225 deg, 3 = 315 deg (same order as the simulation)</text>
