<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1230" viewBox="0 0 1300 1230">
<rect width="100%" height="100%" fill="#fff"/>
<text x="650.0" y="28" font-size="18" text-anchor="middle" fill="#000" font-family="Helvetica,Arial,sans-serif" font-weight="bold">Candle, snuffer magnet, calibration risers, side camera (dimensions in mm)</text>
<text x="40" y="60" font-size="13" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif" font-weight="bold">A. Candle (section, x6)</text>
<line x1="20" y1="470" x2="260" y2="470" stroke="#a07050" stroke-width="2"/>
<text x="22" y="484" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">icing top</text>
<rect x="105.0" y="218.0" width="30.0" height="312.0" rx="0" stroke="#000" fill="#f2f2f2" stroke-width="1.4"/>
<text x="144.0" y="350.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">tube 5.0 OD x 0.45 wall aluminium,</text>
<text x="144.0" y="363.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">painted white; 42 above icing, 25 in foam</text>
<rect x="105.0" y="176.0" width="30.0" height="42.0" rx="0" stroke="#c06000" fill="#ffd27a" stroke-width="1.4"/>
<text x="144.0" y="200.0" font-size="10" text-anchor="start" fill="#c06000" font-family="Helvetica,Arial,sans-serif">D1 5 mm flat-top amber LED, frosted, 7.0 long</text>
<rect x="110.4" y="170.0" width="19.200000000000003" height="6.0" rx="0" stroke="#1f4fbf" fill="#1f4fbf" stroke-width="1"/>
<text x="144.0" y="168.0" font-size="10" text-anchor="start" fill="#1f4fbf" font-family="Helvetica,Arial,sans-serif">Q1 ALS-PT19 face up, glued on the LED's flat top = TIP</text>
<rect x="111.3" y="224.0" width="17.4" height="6.6000000000000005" rx="0" stroke="#107010" fill="#107010" stroke-width="1"/>
<text x="144.0" y="233.0" font-size="10" text-anchor="start" fill="#107010" font-family="Helvetica,Arial,sans-serif">U1 DRV5053VA, face up, top 9 below tip</text>
<text x="144.0" y="246.0" font-size="10" text-anchor="start" fill="#107010" font-family="Helvetica,Arial,sans-serif">(+ C1 10 nF on its legs)</text>
<line x1="131.4" y1="173.0" x2="135.6" y2="173.0" stroke="#1f4fbf" stroke-width="1"/>
<line x1="135.6" y1="173.0" x2="135.6" y2="218.0" stroke="#1f4fbf" stroke-width="1"/>
