<rect x="804.25" y="809.75" width="91.5" height="40.5" rx="0" stroke="#555" fill="#ddd" stroke-width="1"/>
<text x="800.25" y="821.75" font-size="10" text-anchor="end" fill="#000" font-family="Helvetica,Arial,sans-serif">concentrator (72, 30)</text>
