<line x1="90.0" y1="170.0" x2="90.0" y2="470" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
<text x="86.0" y="320.0" font-size="11" text-anchor="end" fill="#000" font-family="Helvetica,Arial,sans-serif">50.0</text>
<text x="86.0" y="333.0" font-size="9" text-anchor="end" fill="#000" font-family="Helvetica,Arial,sans-serif">+-0.5</text>
<line x1="99.0" y1="170.0" x2="99.0" y2="224.0" stroke="#666" stroke-width="1"/>
<text x="95.0" y="200.0" font-size="10" text-anchor="end" fill="#000" font-family="Helvetica,Arial,sans-serif">9</text>
<text x="40" y="510" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">Wire bundle (5 x 0.13 mm enamelled) exits the tube bottom</text>
<text x="40" y="523" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">into the cake's core; candle glued into a 5 mm hole.</text>
<text x="500" y="60" font-size="13" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif" font-weight="bold">B. Snuffer bell with magnet (section, x6)</text>
<polyline points="571.0,308.0 571.0,140 709.0,140 709.0,308.0" stroke="#9a7a20" stroke-width="3" fill="none"/>
<polyline points="578.2,308.0 578.2,147.2 701.8,147.2 701.8,308.0" stroke="#9a7a20" stroke-width="1" fill="#fff8e0"/>
<rect x="604.0" y="116.0" width="72.0" height="24.0" rx="0" stroke="#555" fill="#888" stroke-width="1"/>
<text x="719.0" y="128.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">magnet: 12 x 4 mm N52 disc (or 2 x 12 x 2 stacked), axially</text>
<text x="719.0" y="141.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">magnetised, epoxied centred on the OUTSIDE of the bell top</text>
<text x="719.0" y="154.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">(3.4 g; bore and depth unchanged; centre within 1 mm of the axis)</text>
<text x="719.0" y="224.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">bore 20.6 (inner radius 10.3), outer 23</text>
<text x="719.0" y="237.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">depth 28 (rim to inside top)</text>
<line x1="640" y1="100" x2="640" y2="328.0" stroke="#666" stroke-width="1" stroke-dasharray="6,4"/>
<text x="644" y="338.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">bell axis</text>
<rect x="671.8" y="290.0" width="30.0" height="30" rx="0" stroke="#1f4fbf" fill="none" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="705.8" y="302.0" font-size="10" text-anchor="start" fill="#1f4fbf" font-family="Helvetica,Arial,sans-serif">P2: tip 3 above rim, 7.8 off axis</text>
<rect x="578.2" y="152.0" width="30.0" height="30" rx="0" stroke="#1f4fbf" fill="none" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="563.0" y="164.0" font-size="10" text-anchor="end" fill="#1f4fbf" font-family="Helvetica,Arial,sans-serif">P3: tip 26 above rim,</text>
<text x="563.0" y="177.0" font-size="10" text-anchor="end" fill="#1f4fbf" font-family="Helvetica,Arial,sans-serif">7.8 off axis</text>
<line x1="551.0" y1="308.0" x2="729.0" y2="308.0" stroke="#666" stroke-width="1" stroke-dasharray="2,3"/>
<text x="547.0" y="312.0" font-size="10" text-anchor="end" fill="#000" font-family="Helvetica,Arial,sans-serif">rim</text>
<text x="500" y="360.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">Covered (sim and real): tip within 7.8 of the axis, 3 above the rim to 2 below the</text>
<text x="500" y="373.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">inside top, bell within 30 deg of upright; continuously for 1.0 s.</text>
<text x="40" y="620" font-size="13" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif" font-weight="bold">C. Calibration risers: open stands (print in black PETG/PLA)</text>
<rect x="60" y="861.0" width="78.0" height="9.0" rx="0" stroke="#000" fill="#444" stroke-width="1.2"/>
<rect x="64.5" y="729.0" width="9.0" height="132.0" rx="0" stroke="#000" fill="#666" stroke-width="1"/>
<rect x="124.5" y="729.0" width="9.0" height="132.0" rx="0" stroke="#000" fill="#666" stroke-width="1"/>
<rect x="60" y="729.0" width="78.0" height="9.0" rx="0" stroke="#000" fill="#444" stroke-width="1.2"/>
<rect x="67.8" y="723.0" width="6.0" height="6.0" rx="0" stroke="#000" fill="#444" stroke-width="1"/>
<rect x="114.9" y="720.0" width="15.0" height="150.0" rx="0" stroke="#1f4fbf" fill="none" stroke-width="1" stroke-dasharray="3,2"/>
<text x="122.4" y="716.0" font-size="9" text-anchor="middle" fill="#1f4fbf" font-family="Helvetica,Arial,sans-serif">candle</text>
<text x="60" y="888" font-size="11" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif" font-weight="bold">RISER-47 (shallow edge, P2)</text>
<text x="60" y="902" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">rim seat 47 above the icing (base bottom)</text>
<line x1="52" y1="870" x2="52" y2="729.0" stroke="#666" stroke-width="1"/>
<text x="50" y="799.5" font-size="10" text-anchor="end" fill="#000" font-family="Helvetica,Arial,sans-serif">47</text>
<rect x="360" y="861.0" width="78.0" height="9.0" rx="0" stroke="#000" fill="#444" stroke-width="1.2"/>
<rect x="364.5" y="798.0" width="9.0" height="63.0" rx="0" stroke="#000" fill="#666" stroke-width="1"/>
<rect x="424.5" y="798.0" width="9.0" height="63.0" rx="0" stroke="#000" fill="#666" stroke-width="1"/>
<rect x="360" y="798.0" width="78.0" height="9.0" rx="0" stroke="#000" fill="#444" stroke-width="1.2"/>
<rect x="367.8" y="792.0" width="6.0" height="6.0" rx="0" stroke="#000" fill="#444" stroke-width="1"/>
<rect x="414.9" y="789.0" width="15.0" height="81.0" rx="0" stroke="#1f4fbf" fill="none" stroke-width="1" stroke-dasharray="3,2"/>
<text x="422.4" y="785.0" font-size="9" text-anchor="middle" fill="#1f4fbf" font-family="Helvetica,Arial,sans-serif">candle</text>
<text x="360" y="888" font-size="11" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif" font-weight="bold">RISER-24 (deep edge, P3)</text>
<text x="360" y="902" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">rim seat 24 above the icing (base bottom)</text>
<line x1="352" y1="870" x2="352" y2="798.0" stroke="#666" stroke-width="1"/>
<text x="350" y="834.0" font-size="10" text-anchor="end" fill="#000" font-family="Helvetica,Arial,sans-serif">24</text>
<text x="60" y="930" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">Base disc 26 OD x 3 with a 5.3 hole whose centre is 7.8 from the disc axis (the candle passes through it).</text>
<text x="60" y="943" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">Three 3 mm legs on an 11.5 radius at 60, 180, 300 deg from the hole direction; sides open so room light</text>
<text x="60" y="956" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">reaches the rim as in a real cover. Top ring 26 OD / 21.0 ID x 3: its top face is the rim seat; three</text>
<text x="60" y="969" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">2 x 3 x 1.5 centring tabs on its inner edge at 60, 180, 300 deg hold the bell coaxial with the base.</text>
<text x="60" y="982" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">Use: slide the riser down over one candle onto the icing; seat the real snuffer's bell on the ring.</text>
<text x="60" y="995" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">Tip = 50 - seat height above the rim: RISER-47 -&gt; 3 (P2), RISER-24 -&gt; 26 (P3); both 7.8 off the bell axis.</text>
<text x="60" y="1008" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">Rotate the riser 180 deg to test the offset toward and away from the cake centre.</text>
<text x="60" y="1021" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">SPACER-10: a 10 x 30 x 60 black block (N1: bell wall 1 cm beside the candle).</text>
<text x="60" y="1034" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">Other snuffers: tab circle = bore - 0.3; deep seat height = 52 - inside depth.</text>
<text x="700" y="590" font-size="13" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif" font-weight="bold">D. Side camera (plan view, cm)</text>
<rect x="900.0" y="1000.0" width="200.0" height="140.0" rx="0" stroke="#7a5a30" fill="#f1e2c8" stroke-width="1.2"/>
<text x="904.0" y="1012.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">tray (24, 0)</text>
