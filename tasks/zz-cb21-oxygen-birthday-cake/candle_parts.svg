<text x="700" y="1215" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">x forward (up the page), y left; table height 0</text>
<text x="809.0" y="937.0" font-size="10" text-anchor="start" fill="#1f4fbf" font-family="Helvetica,Arial,sans-serif">mat (38, 17)</text>
<circle cx="735.0" cy="960.0" r="10" stroke="#555" fill="#ccc" stroke-width="1.6"/>
<text x="749.0" y="964.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">Grandpa</text>
<rect x="992.0" y="632.0" width="16" height="16" rx="0" stroke="#c00000" fill="#c00000" stroke-width="1.6"/>
<text x="1012.0" y="644.0" font-size="10" text-anchor="start" fill="#c00000" font-family="Helvetica,Arial,sans-serif">SIDE CAM (110, 0), lens 6 cm above the table, looking -x</text>
<line x1="1000.0" y1="640.0" x2="1000.0" y2="1070.0" stroke="#c00000" stroke-width="1" stroke-dasharray="5,4"/>
<circle cx="1000.0" cy="1190.0" r="5" stroke="#000" fill="#000" stroke-width="1.6"/>
<text x="1008.0" y="1186.0" font-size="10" text-anchor="start" fill="#000" font-family="Helvetica,Arial,sans-serif">arm-base midpoint (0, 0)</text>
